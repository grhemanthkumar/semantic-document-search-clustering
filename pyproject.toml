[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-document-clustering"
version = "0.1.0"
description = "Semantic document search and clustering with sentence embeddings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "sentence-transformers>=5.1,<7",
]

[project.scripts]
semantic-docs = "semantic_document_clustering.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
